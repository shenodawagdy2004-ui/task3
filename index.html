<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الآلة الحاسبة</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- التحقق من العمر -->

        <div id="ageBox">

            <h2>أهلاً بك 👋</h2>

            <p>من فضلك أدخل عمرك للمتابعة</p>

            <div class="age-input">

                <input
                    type="number"
                    id="ageInput"
                    placeholder="أدخل عمرك"
                >

                <button onclick="checkAge()">
                    متابعة
                </button>

            </div>

            <p id="ageMessage"></p>

        </div>


        <!-- الآلة الحاسبة -->

        <div id="calculator">

            <h1>الآلة الحاسبة</h1>

            <input
                type="text"
                id="display"
                readonly
            >


            <div class="buttons">

                <button class="number" onclick="appendToDisplay('7')">
                    7
                </button>

                <button class="number" onclick="appendToDisplay('8')">
                    8
                </button>

                <button class="number" onclick="appendToDisplay('9')">
                    9
                </button>

                <button class="operator" onclick="appendToDisplay('/')">
                    ÷
                </button>


                <button class="number" onclick="appendToDisplay('4')">
                    4
                </button>

                <button class="number" onclick="appendToDisplay('5')">
                    5
                </button>

                <button class="number" onclick="appendToDisplay('6')">
                    6
                </button>

                <button class="operator" onclick="appendToDisplay('*')">
                    ×
                </button>


                <button class="number" onclick="appendToDisplay('1')">
                    1
                </button>

                <button class="number" onclick="appendToDisplay('2')">
                    2
                </button>

                <button class="number" onclick="appendToDisplay('3')">
                    3
                </button>

                <button class="operator" onclick="appendToDisplay('-')">
                    −
                </button>


                <button class="number" onclick="appendToDisplay('0')">
                    0
                </button>

                <button class="number" onclick="appendToDisplay('.')">
                    .
                </button>

                <button class="clear" onclick="clearDisplay()">
                    مسح
                </button>

                <button class="operator" onclick="appendToDisplay('+')">
                    +
                </button>


                <button class="delete" onclick="deleteLast()">
                    حذف
                </button>

                <button class="equal" onclick="calculate()">
                    =
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
